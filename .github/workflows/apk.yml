name: APK de teste

on:
  push:
    branches: [design/album-home]
    paths: ['android/**', 'prototypes/app/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copiar o protótipo para o app
        run: ./android/copy-web.sh
      - name: Gerar APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "meu-album-teste-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: meu-album-teste-${{ github.run_number }}
          path: meu-album-teste-${{ github.run_number }}.apk
      - name: Publicar em release rascunho (só quem tem acesso ao repositório vê)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-teste-${{ github.run_number }}" "meu-album-teste-${{ github.run_number }}.apk" \
            --draft --target "${{ github.sha }}" \
            --title "Meu Álbum — APK de teste ${{ github.run_number }}" \
            --notes "APK de teste (debug) do protótipo v1. Instale no Android permitindo apps de fontes desconhecidas. As imagens das cartas carregam da internet."
